name: Release

# Publish turbine-orm to npm when a `v*` tag is pushed.
#
# Setup (one-time):
#   1. Generate an npm automation token (Settings → Access Tokens → Generate New → Automation)
#      https://docs.npmjs.com/creating-and-viewing-access-tokens
#   2. Add it to this repo as a secret named NPM_TOKEN
#      (Settings → Secrets and variables → Actions → New repository secret)
#
# Usage:
#   npm version patch   # or minor / major, bumps package.json and creates a git tag
#   git push --follow-tags
#
# The workflow runs lint → typecheck → unit tests → build, then the release
# gates that mirror ci.yml (a real Postgres integration run on the seeded fixture,
# the packed-tarball smoke test, the coverage thresholds, and the error-code
# contract check) before it verifies that package.json version matches the tag
# and publishes with `--provenance` so the npm registry can attest the build to
# this repo.
#
# A publish requires ALL of: test (lint/typecheck/unit/build/size),
# integration-postgres (real DB), pack-smoke (published package surface),
# package-types (publint + attw + a real CJS consumer typecheck),
# coverage (.c8rc.json thresholds, measured against a real DB), and error-codes
# (every thrown error inside the TURBINE_E* contract). Each gate job is defined
# here rather than reused from ci.yml because ci.yml is triggered by push/PR, not
# by the tag that starts a release, so a tag run has no CI run to depend on. The
# full multi-version / multi-engine matrix still lives in ci.yml on push; the
# release gate runs one representative Postgres so a tag can never publish SQL a
# real Postgres rejects, a broken package surface, a coverage regression, or an
# untracked error class.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip npm publish)'
        type: boolean
        default: false

permissions:
  contents: write
  # Required for npm provenance attestation
  id-token: write

# Releases queue, they never cancel each other MID-RUN: cancelling a
# half-finished publish can leave npm updated with no tag-side follow-through
# (GitHub Release, smoke test). One shared group means a second tag pushed
# while a release is running waits its turn instead of racing it. Known
# limit: GitHub keeps at most ONE run PENDING per group, so a third tag
# pushed while one runs and one waits evicts the waiter; that tag then needs
# a re-run (or a `workflow_dispatch`) to publish. Tags here are one at a
# time, so the queue-of-one is accepted rather than worked around.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      # The CLI coverage gate (cli/studio.ts, cli/migrate.ts,
      # cli/destructive.ts): write mode, destructive DDL, and the scanner that
      # classifies DDL as destructive. Own thresholds, see .c8rc.json's
      # //cli-gate note. No database, a few seconds.
      - name: CLI coverage thresholds
        run: npm run test:coverage:cli

      # CHANGELOG heading contract. It lived only in prepublishOnly, so a tag
      # push (which never runs prepublishOnly) could publish over a violation.
      - name: CHANGELOG headings
        run: npm run check:changelog

      - name: Build
        run: npm run build

      # Bundle size gate, size-limit is the single source of truth (same check
      # CI runs). Measures the bundled import graph against .size-limit.js limits
      # (~31 kB main / ~22 kB edge, under 35/25 ceilings). Replaces the previous
      # stale hard-coded 150 kB tarball check that never matched reality.
      - name: Verify bundle sizes
        run: npx size-limit

  # Postgres integration gate, mirrors ci.yml's integration-tests but pinned to
  # a single representative major (16). Seeds src/test/fixtures/seed.sql, then
  # runs the full DB-backed suite so a tag can never publish SQL that a real
  # Postgres rejects. The 14/15/16/17 matrix stays in ci.yml on push.
  integration-postgres:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: turbine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Seed test database
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f src/test/fixtures/seed.sql
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/turbine_test
          PGPASSWORD: test
      - run: npm test
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/turbine_test

  # Packed-tarball smoke gate, mirrors ci.yml's pack-smoke. Installs the real
  # `npm pack` output into a clean temp project and verifies the published
  # package surface (ESM import, CJS require, CLI bin, and every subpath export)
  # so a tag can never publish a broken exports map or missing dist file.
  pack-smoke:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pack tarball
        run: |
          TARBALL=$(npm pack --silent | tail -1)
          echo "TARBALL=$GITHUB_WORKSPACE/$TARBALL" >> "$GITHUB_ENV"
          echo "EXPECTED_VERSION=$(jq -r .version package.json)" >> "$GITHUB_ENV"
      - name: Verify packed manifest has no install scripts
        # The published tarball must not ship prepare/preinstall/install/postinstall.
        run: |
          MANIFEST=$(tar -xzOf "$TARBALL" package/package.json)
          BANNED=$(echo "$MANIFEST" | jq -r '
            (.scripts // {}) | keys[]
            | select(. == "prepare" or . == "preinstall" or . == "install" or . == "postinstall")
          ')
          if [ -n "$BANNED" ]; then
            echo "Published manifest must not contain install scripts, found:"
            echo "$BANNED"
            echo "$MANIFEST" | jq '.scripts'
            exit 1
          fi
          echo "Packed manifest has no install scripts OK"
      - name: Install tarball in temp project
        run: |
          SMOKE_DIR=$(mktemp -d)
          echo "SMOKE_DIR=$SMOKE_DIR" >> "$GITHUB_ENV"
          cd "$SMOKE_DIR"
          npm init -y > /dev/null
          npm install "$TARBALL" --no-audit --no-fund
      - name: Verify ESM import
        working-directory: ${{ env.SMOKE_DIR }}
        run: |
          node --input-type=module -e "const m = await import('turbine-orm'); if (!m.TurbineClient) { console.error('ESM import missing TurbineClient'); process.exit(1); } console.log('ESM import OK');"
      - name: Verify CJS require
        working-directory: ${{ env.SMOKE_DIR }}
        run: |
          node -e "const m = require('turbine-orm'); if (!m.TurbineClient) { console.error('CJS require missing TurbineClient'); process.exit(1); } console.log('CJS require OK');"
      - name: Verify CLI bin prints version
        working-directory: ${{ env.SMOKE_DIR }}
        run: |
          npx turbine --version
          npx turbine --version | grep -F "$EXPECTED_VERSION"
      - name: Verify serverless subpath import
        working-directory: ${{ env.SMOKE_DIR }}
        run: |
          node --input-type=module -e "const m = await import('turbine-orm/serverless'); if (typeof m.turbineHttp !== 'function') { console.error('serverless subpath missing turbineHttp'); process.exit(1); } console.log('serverless subpath OK');"
      - name: Verify sqlite subpath import
        working-directory: ${{ env.SMOKE_DIR }}
        run: |
          node --input-type=module -e "const m = await import('turbine-orm/sqlite'); if (m.sqliteDialect?.name !== 'sqlite' || typeof m.turbineSqlite !== 'function') { console.error('sqlite subpath broken'); process.exit(1); } console.log('sqlite subpath OK');"
      - name: Verify adapters subpath import
        working-directory: ${{ env.SMOKE_DIR }}
        run: |
          node --input-type=module -e "const m = await import('turbine-orm/adapters'); if (!m.cockroachdb || !m.yugabytedb || !m.postgresql) { console.error('adapters subpath broken'); process.exit(1); } console.log('adapters subpath OK', Object.keys(m).slice(0,8).join(','));"
      # The three engine subpaths and prisma-compat. This job used to verify
      # serverless/sqlite/adapters only, so the RELEASE path, the one that
      # decides whether a version reaches npm, checked fewer published entry
      # points than CI did. mysql/mssql/powdb must import with their optional
      # peers ABSENT (this temp project never installs them): the peer is loaded
      # by a dynamic import inside the factory, so a static import creeping into
      # the module graph would break every Postgres user and is exactly what this
      # catches. prisma-compat was import-smoked on NEITHER path.
      - name: Verify mysql subpath import (mysql2 NOT installed, must not crash)
        working-directory: ${{ env.SMOKE_DIR }}
        run: |
          node --input-type=module -e "const m = await import('turbine-orm/mysql'); if (m.mysqlDialect?.name !== 'mysql' || typeof m.turbineMysql !== 'function') { console.error('mysql subpath broken'); process.exit(1); } console.log('mysql subpath OK (no mysql2 needed to import)');"
      - name: Verify mssql subpath import (mssql NOT installed, must not crash)
        working-directory: ${{ env.SMOKE_DIR }}
        run: |
          node --input-type=module -e "const m = await import('turbine-orm/mssql'); if (m.mssqlDialect?.name !== 'mssql' || typeof m.turbineMssql !== 'function') { console.error('mssql subpath broken'); process.exit(1); } console.log('mssql subpath OK (no mssql needed to import)');"
      - name: Verify powdb subpath import (peers NOT installed, must not crash)
        working-directory: ${{ env.SMOKE_DIR }}
        run: |
          node --input-type=module -e "const m = await import('turbine-orm/powdb'); if (typeof m.turbinePowDB !== 'function') { console.error('powdb subpath broken'); process.exit(1); } console.log('powdb subpath OK (no peer needed to import)');"
      - name: Verify prisma-compat subpath import
        working-directory: ${{ env.SMOKE_DIR }}
        run: |
          node --input-type=module -e "const m = await import('turbine-orm/prisma-compat'); if (typeof m.createPrismaCompatClient !== 'function' || !m.Prisma) { console.error('prisma-compat subpath broken, exports: ' + Object.keys(m).join(',')); process.exit(1); } console.log('prisma-compat subpath OK');"

  # Coverage gate: mirrors ci.yml's coverage job (same Postgres 16 service, same
  # seed, same DATABASE_URL wiring) so the thresholds in .c8rc.json are enforced
  # on the release path too, not only on push. A tag cannot publish under a
  # coverage regression.
  coverage:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: turbine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Seed test database
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f src/test/fixtures/seed.sql
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/turbine_test
          PGPASSWORD: test
      - run: npm run test:coverage
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/turbine_test

  # Error-code gate: mirrors ci.yml's error-codes job. Every `throw new` in src/
  # must be a known TurbineError subclass (or an explicitly allow-listed
  # module-local class), so a release can never ship an error outside the
  # documented TURBINE_E* contract.
  error-codes:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check error code enforcement
        run: npx tsx scripts/check-error-codes.ts

  # Publish-surface type gate: mirrors ci.yml's package-types job. pack-smoke
  # only proves the package RUNS from CJS; this proves its TYPES resolve from
  # CJS too (the TS1479 class of bug, invisible at runtime). publint + attw on
  # the packed tarball, then a real .cts consumer typechecked against it.
  package-types:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: publint + are-the-types-wrong
        run: npm run check:package
      - name: Pack tarball
        run: echo "TARBALL=$GITHUB_WORKSPACE/$(npm pack --silent | tail -1)" >> "$GITHUB_ENV"
      - name: Typecheck a CommonJS consumer against the packed tarball
        run: |
          CONSUMER=$(mktemp -d)
          cd "$CONSUMER"
          cat > package.json <<'JSON'
          { "name": "cjs-consumer", "version": "1.0.0", "private": true, "type": "commonjs" }
          JSON
          cat > tsconfig.json <<'JSON'
          {
            "compilerOptions": {
              "module": "nodenext",
              "moduleResolution": "nodenext",
              "target": "ES2022",
              "strict": true,
              "noEmit": true,
              "skipLibCheck": true
            },
            "include": ["consumer.cts"]
          }
          JSON
          cat > consumer.cts <<'TS'
          import { TurbineClient, TurbineError } from 'turbine-orm';
          import { turbineHttp } from 'turbine-orm/serverless';
          import { turbineSqlite } from 'turbine-orm/sqlite';
          import { turbineMysql } from 'turbine-orm/mysql';
          import { turbineMssql } from 'turbine-orm/mssql';
          import { turbinePowDB } from 'turbine-orm/powdb';
          import { postgresql } from 'turbine-orm/adapters';
          const req = require('turbine-orm') as typeof import('turbine-orm');
          export const check = [
            TurbineClient, TurbineError, turbineHttp, turbineSqlite,
            turbineMysql, turbineMssql, turbinePowDB, postgresql, req.TurbineClient,
          ];
          TS
          npm install "$TARBALL" --no-audit --no-fund
          npm install --no-save typescript @types/node --no-audit --no-fund
          npx tsc --noEmit -p tsconfig.json
          sed -i 's/"module": "nodenext"/"module": "node16"/; s/"moduleResolution": "nodenext"/"moduleResolution": "node16"/' tsconfig.json
          npx tsc --noEmit -p tsconfig.json
          echo "CJS consumer typecheck OK (nodenext + node16)"

  publish:
    timeout-minutes: 30
    needs: [test, integration-postgres, pack-smoke, package-types, coverage, error-codes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve version and ensure tag exists
        run: |
          PKG_VERSION=$(jq -r .version package.json)
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/v}"
            if [ "$TAG" != "$PKG_VERSION" ]; then
              echo "::error::Tag v$TAG does not match package.json version $PKG_VERSION"
              exit 1
            fi
          else
            # workflow_dispatch, create tag if it doesn't exist
            if ! git rev-parse "v$PKG_VERSION" >/dev/null 2>&1; then
              git tag "v$PKG_VERSION"
              git push origin "v$PKG_VERSION"
              echo "Created and pushed tag v$PKG_VERSION"
            fi
          fi
          echo "Publishing turbine-orm@$PKG_VERSION"

      - name: Build
        run: npm run build

      # Backfilled/old tags must not re-attempt a publish: npm rejects
      # republishing an existing version, which would just paint the run red.
      - name: Check version not already published
        id: published
        run: |
          PKG_VERSION=$(jq -r .version package.json)
          if npm view "turbine-orm@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "already=true >> note: turbine-orm@$PKG_VERSION already on npm, skipping publish"
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: ${{ github.event.inputs.dry_run != 'true' && steps.published.outputs.already != 'true' }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Install the just-published version from the public registry in a clean
      # temp project and verify the package surface (ESM import, CJS require,
      # CLI bin, serverless subpath). Registry propagation can lag the publish,
      # so retry the install for up to ~2 minutes before failing.
      - name: Post-publish smoke test
        if: ${{ github.event.inputs.dry_run != 'true' && steps.published.outputs.already != 'true' }}
        env:
          # setup-node's .npmrc references NODE_AUTH_TOKEN; npm errors on any
          # command if it's undefined, so keep it set for this step too.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PKG_VERSION=$(jq -r .version package.json)
          SMOKE_DIR=$(mktemp -d)
          cd "$SMOKE_DIR"
          npm init -y > /dev/null
          INSTALLED=0
          for i in $(seq 1 12); do
            if npm install "turbine-orm@$PKG_VERSION" --no-audit --no-fund; then
              INSTALLED=1
              break
            fi
            echo "turbine-orm@$PKG_VERSION not installable yet, retrying in 10s ($i/12)..."
            sleep 10
          done
          if [ "$INSTALLED" != "1" ]; then
            echo "::error::turbine-orm@$PKG_VERSION never became installable from the registry"
            exit 1
          fi
          node --input-type=module -e "const m = await import('turbine-orm'); if (!m.TurbineClient) { console.error('ESM import missing TurbineClient'); process.exit(1); } console.log('ESM import OK');"
          node -e "const m = require('turbine-orm'); if (!m.TurbineClient) { console.error('CJS require missing TurbineClient'); process.exit(1); } console.log('CJS require OK');"
          node --input-type=module -e "const m = await import('turbine-orm/serverless'); if (typeof m.turbineHttp !== 'function') { console.error('serverless subpath missing turbineHttp'); process.exit(1); } console.log('serverless subpath OK');"
          npx turbine --version
          npx turbine --version | grep -F "$PKG_VERSION"
          echo "Post-publish smoke test passed for turbine-orm@$PKG_VERSION"

      # The GitHub Release used to be a manual `gh release create` after every
      # publish, which meant it was sometimes late and could drift from the
      # CHANGELOG. Now the same run that publishes to npm creates it, with the
      # release notes extracted verbatim from the version's CHANGELOG section.
      # Idempotent: an existing release (manual or from a re-run) is left alone.
      # Runs even when the npm publish was skipped as already-published, so a
      # re-run can backfill a missing release without republishing.
      - name: Create GitHub Release from CHANGELOG
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PKG_VERSION=$(jq -r .version package.json)
          TAG="v$PKG_VERSION"
          if gh release view "$TAG" --json tagName >/dev/null 2>&1; then
            echo "Release $TAG already exists, leaving it alone"
            exit 0
          fi
          # Extract this version's section: from its `## <version> (date)`
          # heading (exclusive) to the next `## ` heading or EOF. The version
          # token is stripped of anything after the digits/dots, so a heading
          # like `## 0.65.0, subtitle` still matches (the changelog-headings
          # guard only requires the `## X.Y.Z` prefix, and this step must not
          # be stricter than the guard that fronts it).
          NOTES=$(awk -v ver="$PKG_VERSION" '
            /^## / { v = $2; sub(/[^0-9.].*$/, "", v); if (found) exit; if (v == ver) { found = 1; next } }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no section for $PKG_VERSION, cannot build release notes"
            exit 1
          fi
          echo "$NOTES" | gh release create "$TAG" --title "$TAG" --notes-file - --verify-tag
          echo "Created GitHub Release $TAG from the CHANGELOG section"

      - name: Dry run, verify package
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: npm pack --dry-run
