name: Release

# Publish turbine-orm to npm when a `v*` tag is pushed.
#
# Setup (one-time):
#   1. Generate an npm automation token (Settings → Access Tokens → Generate New → Automation)
#      https://docs.npmjs.com/creating-and-viewing-access-tokens
#   2. Add it to this repo as a secret named NPM_TOKEN
#      (Settings → Secrets and variables → Actions → New repository secret)
#
# Usage (docs/WORKFLOW.md, section 2): land the release commit on main through
# a PR, then tag it. `main` is PR-only, so `npm version` + `git push
# --follow-tags` is refused there; the tag alone is the publish trigger.
#   git tag vX.Y.Z && git push origin vX.Y.Z
#
# The workflow runs lint → typecheck → unit tests → build, then the release
# gates that mirror ci.yml (a real Postgres integration run on the seeded fixture,
# the packed-tarball smoke test, the coverage thresholds, and the error-code
# contract check) before it verifies that package.json version matches the tag
# and publishes with `--provenance` so the npm registry can attest the build to
# this repo.
#
# A publish requires ALL of: test (lint/typecheck/unit/build/size),
# integration-postgres (real DB), pack-smoke (published package surface),
# package-types (publint + attw + a real CJS consumer typecheck),
# coverage (.c8rc.json thresholds, measured against a real DB), and error-codes
# (every thrown error inside the TURBINE_E* contract). Each gate job is defined
# here rather than reused from ci.yml because ci.yml is triggered by push/PR, not
# by the tag that starts a release, so a tag run has no CI run to depend on. The
# full multi-version / multi-engine matrix still lives in ci.yml on push; the
# release gate runs one representative Postgres so a tag can never publish SQL a
# real Postgres rejects, a broken package surface, a coverage regression, or an
# untracked error class.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip npm publish)'
        type: boolean
        default: false

# Least privilege at the workflow level, the same posture as ci.yml. Every
# pre-publish gate job runs `npm ci` and then the whole devDependency tree,
# and none of them writes anything, so none of them should hold a token that
# can. `publish` alone needs more (the tag push on the workflow_dispatch path,
# `gh release create`, and an OIDC token for the npm provenance attestation)
# and declares it on the job. Before this block was narrowed, a compromised
# devDependency running inside `test` held a token that could push to main.
permissions:
  contents: read

# Releases queue, they never cancel each other MID-RUN: cancelling a
# half-finished publish can leave npm updated with no tag-side follow-through
# (GitHub Release, smoke test). One shared group means a second tag pushed
# while a release is running waits its turn instead of racing it. Known
# limit: GitHub keeps at most ONE run PENDING per group, so a third tag
# pushed while one runs and one waits evicts the waiter; that tag then needs
# a re-run (or a `workflow_dispatch`) to publish. Tags here are one at a
# time, so the queue-of-one is accepted rather than worked around.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Public-repo leak guard. It ran in exactly one place, ci.yml's lint job,
      # which is the one workflow that does not gate publishing. prepublishOnly
      # and this workflow both skipped it, and the pre-commit hook that also
      # runs it is skippable with `git commit --no-verify`. A leak guard with a
      # single bypassable enforcement point is not a guard.
      - name: Private-material guard
        run: npm run check:private-terms

      # Same gap class as the leak guard above, on the same path. These three
      # run in ci.yml and in prepublishOnly, but ci.yml does not gate a tag
      # push and prepublishOnly does not run when the tag path publishes. So
      # on the one route that actually reaches npm they ran nowhere. They are
      # seconds each; the reason they were missing is that nobody diffed the
      # two workflows' guard lists, which is what makes them worth stating.
      - name: Import-cycle guard
        run: npm run check:cycles

      - name: Error-prefix guard
        run: npm run check:error-prefix

      - name: Skip-gate guard
        run: npm run check:skip-gates

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      # The CLI coverage gate (cli/studio.ts, cli/migrate.ts,
      # cli/destructive.ts): write mode, destructive DDL, and the scanner that
      # classifies DDL as destructive. Own thresholds, see .c8rc.json's
      # //cli-gate note. No database, a few seconds.
      - name: CLI coverage thresholds
        run: npm run test:coverage:cli

      # CHANGELOG heading contract. It lived only in prepublishOnly, so a tag
      # push (which never runs prepublishOnly) could publish over a violation.
      - name: CHANGELOG headings
        run: npm run check:changelog

      - name: Build
        run: npm run build

      # Bundle size gate, size-limit is the single source of truth (same check
      # CI runs). Measures the bundled import graph against .size-limit.js limits
      # (~31 kB main / ~22 kB edge, under 35/25 ceilings). Replaces the previous
      # stale hard-coded 150 kB tarball check that never matched reality.
      - name: Verify bundle sizes
        run: npx size-limit

  # Postgres integration gate, mirrors ci.yml's integration-tests but pinned to
  # a single representative major (16). Seeds src/test/fixtures/seed.sql, then
  # runs the full DB-backed suite so a tag can never publish SQL that a real
  # Postgres rejects. The 14/15/16/17 matrix stays in ci.yml on push.
  integration-postgres:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector/pgvector: postgres:<major> plus the `vector` extension, so the
        # KNN assertions in src/test/pgvector.test.ts run instead of skipping.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: turbine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Seed test database
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f src/test/fixtures/seed.sql
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/turbine_test
          PGPASSWORD: test
      - run: npm test
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/turbine_test
          # Parity with ci.yml's integration-tests job. Without this a misnamed
          # DATABASE_URL, an unhealthy container, or a reworded skip-gate reason
          # makes every Postgres suite skip and the job still reports green.
          # That is the exact failure mode the variable exists to prevent, and
          # it was missing from precisely the two jobs that gate what reaches
          # npm. `sqlite` rides along for the same reason it does in ci.yml:
          # this job pins Node 22, so node:sqlite is present and its gates have
          # no business skipping.
          TURBINE_REQUIRE_ENGINE: postgres,sqlite

  # Packed-tarball smoke gate, mirrors ci.yml's pack-smoke. Installs the real
  # `npm pack` output into a clean temp project and verifies the published
  # package surface (ESM import, CJS require, CLI bin, and every subpath export)
  # so a tag can never publish a broken exports map or missing dist file.
  pack-smoke:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pack tarball
        run: |
          TARBALL=$(npm pack --silent | tail -1)
          echo "TARBALL=$GITHUB_WORKSPACE/$TARBALL" >> "$GITHUB_ENV"
          echo "EXPECTED_VERSION=$(jq -r .version package.json)" >> "$GITHUB_ENV"
      - name: Verify packed manifest has no install scripts
        # The published tarball must not ship prepare/preinstall/install/postinstall.
        run: |
          MANIFEST=$(tar -xzOf "$TARBALL" package/package.json)
          BANNED=$(echo "$MANIFEST" | jq -r '
            (.scripts // {}) | keys[]
            | select(. == "prepare" or . == "preinstall" or . == "install" or . == "postinstall")
          ')
          if [ -n "$BANNED" ]; then
            echo "Published manifest must not contain install scripts, found:"
            echo "$BANNED"
            echo "$MANIFEST" | jq '.scripts'
            exit 1
          fi
          echo "Packed manifest has no install scripts OK"
      - name: Install tarball in temp project
        run: |
          SMOKE_DIR=$(mktemp -d)
          echo "SMOKE_DIR=$SMOKE_DIR" >> "$GITHUB_ENV"
          cd "$SMOKE_DIR"
          npm init -y > /dev/null
          npm install "$TARBALL" --no-audit --no-fund
      - name: Verify ESM import
        working-directory: ${{ env.SMOKE_DIR }}
        run: |
          node --input-type=module -e "const m = await import('turbine-orm'); if (!m.TurbineClient) { console.error('ESM import missing TurbineClient'); process.exit(1); } console.log('ESM import OK');"
      - name: Verify CJS require
        working-directory: ${{ env.SMOKE_DIR }}
        run: |
          node -e "const m = require('turbine-orm'); if (!m.TurbineClient) { console.error('CJS require missing TurbineClient'); process.exit(1); } console.log('CJS require OK');"
      - name: Verify CLI bin prints version
        working-directory: ${{ env.SMOKE_DIR }}
        run: |
          npx turbine --version
          npx turbine --version | grep -F "$EXPECTED_VERSION"
      - name: Verify serverless subpath import
        working-directory: ${{ env.SMOKE_DIR }}
        run: |
          node --input-type=module -e "const m = await import('turbine-orm/serverless'); if (typeof m.turbineHttp !== 'function') { console.error('serverless subpath missing turbineHttp'); process.exit(1); } console.log('serverless subpath OK');"
      - name: Verify sqlite subpath import
        working-directory: ${{ env.SMOKE_DIR }}
        run: |
          node --input-type=module -e "const m = await import('turbine-orm/sqlite'); if (m.sqliteDialect?.name !== 'sqlite' || typeof m.turbineSqlite !== 'function') { console.error('sqlite subpath broken'); process.exit(1); } console.log('sqlite subpath OK');"
      - name: Verify adapters subpath import
        working-directory: ${{ env.SMOKE_DIR }}
        run: |
          node --input-type=module -e "const m = await import('turbine-orm/adapters'); if (!m.cockroachdb || !m.yugabytedb || !m.postgresql) { console.error('adapters subpath broken'); process.exit(1); } console.log('adapters subpath OK', Object.keys(m).slice(0,8).join(','));"
      # The three engine subpaths and prisma-compat. This job used to verify
      # serverless/sqlite/adapters only, so the RELEASE path, the one that
      # decides whether a version reaches npm, checked fewer published entry
      # points than CI did. mysql/mssql/powdb must import with their optional
      # peers ABSENT (this temp project never installs them): the peer is loaded
      # by a dynamic import inside the factory, so a static import creeping into
      # the module graph would break every Postgres user and is exactly what this
      # catches. prisma-compat was import-smoked on NEITHER path.
      - name: Verify mysql subpath import (mysql2 NOT installed, must not crash)
        working-directory: ${{ env.SMOKE_DIR }}
        run: |
          node --input-type=module -e "const m = await import('turbine-orm/mysql'); if (m.mysqlDialect?.name !== 'mysql' || typeof m.turbineMysql !== 'function') { console.error('mysql subpath broken'); process.exit(1); } console.log('mysql subpath OK (no mysql2 needed to import)');"
      - name: Verify mssql subpath import (mssql NOT installed, must not crash)
        working-directory: ${{ env.SMOKE_DIR }}
        run: |
          node --input-type=module -e "const m = await import('turbine-orm/mssql'); if (m.mssqlDialect?.name !== 'mssql' || typeof m.turbineMssql !== 'function') { console.error('mssql subpath broken'); process.exit(1); } console.log('mssql subpath OK (no mssql needed to import)');"
      - name: Verify powdb subpath import (peers NOT installed, must not crash)
        working-directory: ${{ env.SMOKE_DIR }}
        run: |
          node --input-type=module -e "const m = await import('turbine-orm/powdb'); if (typeof m.turbinePowDB !== 'function') { console.error('powdb subpath broken'); process.exit(1); } console.log('powdb subpath OK (no peer needed to import)');"
      - name: Verify prisma-compat subpath import
        working-directory: ${{ env.SMOKE_DIR }}
        run: |
          node --input-type=module -e "const m = await import('turbine-orm/prisma-compat'); if (typeof m.createPrismaCompatClient !== 'function' || !m.Prisma) { console.error('prisma-compat subpath broken, exports: ' + Object.keys(m).join(',')); process.exit(1); } console.log('prisma-compat subpath OK');"

  # Coverage gate: mirrors ci.yml's coverage job (same Postgres 16 service, same
  # seed, same DATABASE_URL wiring) so the thresholds in .c8rc.json are enforced
  # on the release path too, not only on push. A tag cannot publish under a
  # coverage regression.
  coverage:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector/pgvector: postgres:<major> plus the `vector` extension, so the
        # KNN assertions in src/test/pgvector.test.ts run instead of skipping.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: turbine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Seed test database
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f src/test/fixtures/seed.sql
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/turbine_test
          PGPASSWORD: test
      - run: npm run test:coverage
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/turbine_test
          # Parity with ci.yml's coverage job, same reasoning as the
          # integration-postgres job above. A fully-skipped run would otherwise
          # measure coverage over SQL generation alone and still meet the
          # thresholds.
          TURBINE_REQUIRE_ENGINE: postgres,sqlite

      # The code-generation ratchet, mirroring ci.yml's coverage job. Re-reports
      # the coverage the step above wrote to coverage/tmp, so it runs no tests.
      - run: npm run coverage:codegen

  # Error-code gate: mirrors ci.yml's error-codes job. Every `throw new` in src/
  # must be a known TurbineError subclass (or an explicitly allow-listed
  # module-local class), so a release can never ship an error outside the
  # documented TURBINE_E* contract.
  error-codes:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check error code enforcement
        run: npx tsx scripts/check-error-codes.ts

  # Claim gate for the shipped agent skill: mirrors ci.yml's verify-skill job.
  # skills/turbine-orm/SKILL.md is in package.json `files`, so a tag push
  # publishes it, and README.md states that every factual claim in it is
  # executed against a live database before release. This is the job that
  # executes them, so a tag cannot publish a skill whose claims have gone stale.
  #
  # Database wiring differs from every other job here on purpose: the harness
  # reads TURBINE_EVAL_URL (never DATABASE_URL) and refuses any database not
  # named `turbine_eval`, and its schema comes from evals/schema.sql via the
  # harness's own `db:reset`, not from src/test/fixtures/seed.sql. `npm run
  # build` first, because evals/node_modules resolves turbine-orm through a
  # symlink to this repo root and therefore imports dist/.
  verify-skill:
    name: verify-skill
    timeout-minutes: 15
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: turbine_eval
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TURBINE_EVAL_URL: postgres://test:test@localhost:5432/turbine_eval
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the package the harness imports
        run: npm run build
      - run: npm ci --prefix evals
      - name: Seed the eval database
        run: npm run db:reset --prefix evals
      - name: Verify every skill claim against the live database
        run: npm run verify:skill --prefix evals

  # Publish-surface type gate: mirrors ci.yml's package-types job. pack-smoke
  # only proves the package RUNS from CJS; this proves its TYPES resolve from
  # CJS too (the TS1479 class of bug, invisible at runtime). publint + attw on
  # the packed tarball, then a real .cts consumer typechecked against it.
  package-types:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: publint + are-the-types-wrong
        run: npm run check:package
      - name: Pack tarball
        run: echo "TARBALL=$GITHUB_WORKSPACE/$(npm pack --silent | tail -1)" >> "$GITHUB_ENV"
      # `"types": ["node"]` is EXPLICIT since 0.70.0, and a tsconfig cannot carry a
      # comment key (tsc rejects an unknown compilerOption with TS5023), so the
      # reason lives here. The fixture uses `require`, a global from @types/node,
      # and it used to arrive by ACCIDENT: @types/pg depends on @types/node, so
      # while @types/pg was a RUNTIME dependency of turbine-orm, installing the
      # tarball populated the consumer's @types directory as a side effect.
      # Moving @types/pg to devDependencies removed that prop and TypeScript's
      # automatic @types inclusion did not cover it, so this job failed on the
      # first real tag push, before publishing. A consumer declaring what it uses
      # is the correct shape; leaning on a dependency's dependency was the bug.
      - name: Typecheck a CommonJS consumer against the packed tarball
        run: |
          CONSUMER=$(mktemp -d)
          cd "$CONSUMER"
          cat > package.json <<'JSON'
          { "name": "cjs-consumer", "version": "1.0.0", "private": true, "type": "commonjs" }
          JSON
          cat > tsconfig.json <<'JSON'
          {
            "compilerOptions": {
              "module": "nodenext",
              "moduleResolution": "nodenext",
              "target": "ES2022",
              "strict": true,
              "noEmit": true,
              "skipLibCheck": true,
              "types": ["node"]
            },
            "include": ["consumer.cts"]
          }
          JSON
          cat > consumer.cts <<'TS'
          import { TurbineClient, TurbineError } from 'turbine-orm';
          import { turbineHttp } from 'turbine-orm/serverless';
          import { turbineSqlite } from 'turbine-orm/sqlite';
          import { turbineMysql } from 'turbine-orm/mysql';
          import { turbineMssql } from 'turbine-orm/mssql';
          import { turbinePowDB } from 'turbine-orm/powdb';
          import { postgresql } from 'turbine-orm/adapters';
          const req = require('turbine-orm') as typeof import('turbine-orm');
          export const check = [
            TurbineClient, TurbineError, turbineHttp, turbineSqlite,
            turbineMysql, turbineMssql, turbinePowDB, postgresql, req.TurbineClient,
          ];
          TS
          npm install "$TARBALL" --no-audit --no-fund
          npm install --no-save typescript @types/node --no-audit --no-fund
          npx tsc --noEmit -p tsconfig.json
          sed -i 's/"module": "nodenext"/"module": "node16"/; s/"moduleResolution": "nodenext"/"moduleResolution": "node16"/' tsconfig.json
          npx tsc --noEmit -p tsconfig.json
          echo "CJS consumer typecheck OK (nodenext + node16)"

  # The `@types/pg` gate, and the permanent guard on the v0.28.1 regression:
  # mirrors ci.yml's consumer-types job. It has to exist HERE and not only
  # there, because ci.yml does not gate a release: this workflow runs on a
  # pushed tag or a workflow_dispatch, and `publish` waits on the jobs in its
  # own `needs:` list. Without this job a tag push would publish the exact
  # regression the pg-free declaration surface exists to prevent, and
  # `package-types` would not have caught it: that job compiles with
  # `skipLibCheck: true`, so tsc never reads the library's own declarations,
  # and its fixture never touches `db.pool` or `transaction()`.
  #
  # `package-types` asks "do the declarations RESOLVE from CJS". This asks
  # "do the declarations require a types package we no longer ship a dependency
  # on". Different questions, and neither answer implies the other.
  consumer-types:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The same script prepublishOnly and ci.yml run. One source of truth, so
      # the publish path cannot drift from the branch path.
      - name: Tripwire, no pg type references in the published declarations
        run: npm run check:package-types
      - name: Assert the packed manifest declares exactly one runtime dependency
        run: |
          TARBALL="$GITHUB_WORKSPACE/$(npm pack --silent | tail -1)"
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"
          DEPS=$(tar -xzOf "$TARBALL" package/package.json | jq -r '(.dependencies // {}) | keys | join(",")')
          if [ "$DEPS" != "pg" ]; then
            echo "::error file=package.json::Published dependencies must be exactly [pg], found [$DEPS]."
            exit 1
          fi
          echo "Packed manifest dependencies = [$DEPS] OK"
      # The end-to-end proof: the REAL tarball installed into a clean project
      # that has `pg` but NOT `@types/pg`. `skipLibCheck: false` is load-bearing
      # and not a stylistic choice: with it true, tsc never reads the library's
      # own declarations, so a pg reference there is suppressed and the gate
      # passes vacuously. The `-d node_modules/@types/pg` assertion exists for
      # the same reason, so the gate cannot pass merely because something pulled
      # @types/pg in transitively and satisfied the reference.
      - name: Typecheck a consumer that has pg but NOT @types/pg
        run: |
          CONSUMER=$(mktemp -d)
          cd "$CONSUMER"
          cat > package.json <<'JSON'
          { "name": "types-consumer", "version": "1.0.0", "private": true, "type": "module" }
          JSON
          cat > tsconfig.json <<'JSON'
          {
            "compilerOptions": {
              "module": "nodenext",
              "moduleResolution": "nodenext",
              "target": "ES2022",
              "strict": true,
              "noEmit": true,
              "skipLibCheck": false
            },
            "include": ["consumer.ts"]
          }
          JSON
          cat > consumer.ts <<'TS'
          import {
            type PgCompatPool,
            type PgCompatPoolClient,
            type PgCompatQueryResult,
            type SchemaMetadata,
            TurbineClient,
          } from 'turbine-orm';
          import { turbineHttp } from 'turbine-orm/serverless';

          const schema: SchemaMetadata = { tables: {}, enums: {} };
          const db = new TurbineClient({ connectionString: 'postgres://u:p@localhost:5432/d' }, schema);

          // The pool accessor is typed by Turbine's own contract, not by @types/pg.
          export async function readOne(): Promise<number | null> {
            const result: PgCompatQueryResult<{ n: number }> = await db.pool.query<{ n: number }>('SELECT 1 AS n');
            const client: PgCompatPoolClient = await db.pool.connect();
            try {
              return result.rows[0]?.n ?? null;
            } finally {
              client.release();
            }
          }

          // The transaction callback's parameter is the same contract.
          export async function inTransaction(): Promise<number> {
            return db.transaction(async (tx: PgCompatPoolClient) => {
              const r = await tx.query<{ n: number }>('SELECT 2 AS n', []);
              return r.rows[0]?.n ?? 0;
            });
          }

          // The external-pool seam: a hand-written driver, no pg types anywhere.
          const externalPool: PgCompatPool = {
            query: async () => ({ rows: [], rowCount: 0 }),
            connect: async () => {
              throw new Error('not reached at typecheck time');
            },
            end: async () => {},
          };
          export const edge = turbineHttp(externalPool, schema);
          TS
          # `pg` explicitly, to mirror a real consumer. @types/pg is never named
          # here and nothing in the tree may pull it in.
          npm install "$TARBALL" pg --no-audit --no-fund
          npm install --no-save typescript @types/node --no-audit --no-fund
          if [ -d node_modules/@types/pg ]; then
            echo "::error file=package.json::@types/pg is present in the consumer tree, so this gate would pass vacuously. Something declares it as a runtime dependency."
            exit 1
          fi
          echo "@types/pg is absent from the consumer tree OK"
          npx tsc --noEmit -p tsconfig.json
          echo "Consumer typecheck OK (strict + NodeNext + skipLibCheck:false, no @types/pg)"

  publish:
    timeout-minutes: 30
    needs: [test, integration-postgres, pack-smoke, package-types, consumer-types, coverage, error-codes, verify-skill]
    runs-on: ubuntu-latest
    # The only job that writes: `contents: write` for the workflow_dispatch tag
    # push and for `gh release create`, `id-token: write` for `--provenance`.
    # A job-level block REPLACES the workflow-level one rather than adding to
    # it, so `contents` is restated here.
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve version and ensure tag exists
        run: |
          PKG_VERSION=$(jq -r .version package.json)
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/v}"
            if [ "$TAG" != "$PKG_VERSION" ]; then
              echo "::error::Tag v$TAG does not match package.json version $PKG_VERSION"
              exit 1
            fi
          else
            # workflow_dispatch, create tag if it doesn't exist
            if ! git rev-parse "v$PKG_VERSION" >/dev/null 2>&1; then
              git tag "v$PKG_VERSION"
              git push origin "v$PKG_VERSION"
              echo "Created and pushed tag v$PKG_VERSION"
            fi
          fi
          echo "Publishing turbine-orm@$PKG_VERSION"

      - name: Build
        run: npm run build

      # The tag is the publish trigger, so on a tag PUSH a version that is
      # already on npm got there some other way: a local `npm publish` before
      # the tag, which turns this whole `needs:` chain into an advisory run over
      # a package strangers already have. That used to be answered with a
      # silent skip, and the skip is how four of the six releases before 0.77.0
      # went out tag-second, one of them from a commit whose CI was red. It is
      # now a FAILURE that names the version, so the run is red and says why.
      # `workflow_dispatch` keeps the skip: it is the deliberate re-run path for
      # backfilling a GitHub Release on a version that is legitimately on the
      # registry (npm refuses a republish, so skipping is what lets the release
      # step below run at all), and the dry run never publishes anyway.
      - name: Check version not already published
        id: published
        run: |
          PKG_VERSION=$(jq -r .version package.json)
          if npm view "turbine-orm@$PKG_VERSION" version >/dev/null 2>&1; then
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "::error::turbine-orm@$PKG_VERSION is already on npm, but this run was started by the v$PKG_VERSION tag push. The tag is what publishes; a version that is on the registry before its tag run exists was published outside the release gates. If only the GitHub Release is missing, re-run this workflow with workflow_dispatch instead."
              exit 1
            fi
            echo "turbine-orm@$PKG_VERSION is already on npm; workflow_dispatch run, skipping the publish"
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: ${{ github.event.inputs.dry_run != 'true' && steps.published.outputs.already != 'true' }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Install the just-published version from the public registry in a clean
      # temp project and verify the package surface (ESM import, CJS require,
      # CLI bin, serverless subpath). Registry propagation can lag the publish,
      # so retry the install for up to ~2 minutes before failing.
      - name: Post-publish smoke test
        if: ${{ github.event.inputs.dry_run != 'true' && steps.published.outputs.already != 'true' }}
        env:
          # setup-node's .npmrc references NODE_AUTH_TOKEN; npm errors on any
          # command if it's undefined, so keep it set for this step too.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PKG_VERSION=$(jq -r .version package.json)
          SMOKE_DIR=$(mktemp -d)
          cd "$SMOKE_DIR"
          npm init -y > /dev/null
          # THE RETRY BUDGET WAS NEVER THE PROBLEM, and raising it twice is how
          # we found that out. 0.73.1 failed here at 12 x 10s, the budget went to
          # 30 x 10s, and 0.77.0 failed at that too, having published fine with
          # provenance both times.
          #
          # The mechanism is npm's CLIENT-SIDE cache, not registry propagation.
          # registry.npmjs.org serves packuments with `Cache-Control: max-age=300`
          # and npm's `prefer-online` defaults to false, so for 300 seconds npm
          # answers from its local cache WITHOUT revalidating. The first attempt,
          # moments after publish, caches a packument that does not yet list the
          # new version; every later attempt reads that same cached copy and never
          # touches the network. 30 x 10s is exactly 300s, so the loop expired at
          # the precise moment its own cache would have. It could not have
          # succeeded, at any point, for any release.
          #
          # `--prefer-online` forces revalidation on every attempt, which is what
          # makes the retries mean something. The budget stays at 5 minutes: it is
          # now a bound on genuine propagation lag rather than a race against a
          # cache TTL.
          #
          # This step runs AFTER an irreversible publish, so its failure message
          # must not read as "the release failed". By this line the package is on
          # the registry with provenance and the GitHub Release step still runs.
          INSTALLED=0
          for i in $(seq 1 30); do
            if npm install "turbine-orm@$PKG_VERSION" --prefer-online --no-audit --no-fund; then
              INSTALLED=1
              break
            fi
            echo "turbine-orm@$PKG_VERSION not installable yet, retrying in 10s ($i/30)..."
            sleep 10
          done
          if [ "$INSTALLED" != "1" ]; then
            echo "::error::turbine-orm@$PKG_VERSION was PUBLISHED but did not become installable within 5 minutes. The package is on the registry; this is a propagation or registry-availability problem, not a bad release. Verify by hand with: npm view turbine-orm@$PKG_VERSION version"
            exit 1
          fi
          node --input-type=module -e "const m = await import('turbine-orm'); if (!m.TurbineClient) { console.error('ESM import missing TurbineClient'); process.exit(1); } console.log('ESM import OK');"
          node -e "const m = require('turbine-orm'); if (!m.TurbineClient) { console.error('CJS require missing TurbineClient'); process.exit(1); } console.log('CJS require OK');"
          node --input-type=module -e "const m = await import('turbine-orm/serverless'); if (typeof m.turbineHttp !== 'function') { console.error('serverless subpath missing turbineHttp'); process.exit(1); } console.log('serverless subpath OK');"
          npx turbine --version
          npx turbine --version | grep -F "$PKG_VERSION"
          echo "Post-publish smoke test passed for turbine-orm@$PKG_VERSION"

      # The GitHub Release used to be a manual `gh release create` after every
      # publish, which meant it was sometimes late and could drift from the
      # CHANGELOG. Now the same run that publishes to npm creates it, with the
      # release notes extracted verbatim from the version's CHANGELOG section.
      # Idempotent: an existing release (manual or from a re-run) is left alone.
      # Runs even when the npm publish was skipped as already-published, so a
      # re-run can backfill a missing release without republishing.
      # `always()` scoped to "the publish step got that far": the tarball is on
      # the registry by now whatever the smoke test said, and a published
      # version with no release notes is strictly worse than notes for a version
      # whose smoke test needs a look. A genuine smoke failure still fails the
      # JOB, which is the signal that matters.
      - name: Create GitHub Release from CHANGELOG
        if: ${{ !cancelled() && github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PKG_VERSION=$(jq -r .version package.json)
          TAG="v$PKG_VERSION"
          if gh release view "$TAG" --json tagName >/dev/null 2>&1; then
            echo "Release $TAG already exists, leaving it alone"
            exit 0
          fi
          # Extract this version's section: from its `## <version> (date)`
          # heading (exclusive) to the next `## ` heading or EOF. The version
          # token is stripped of anything after the digits/dots, so a heading
          # like `## 0.65.0, subtitle` still matches (the changelog-headings
          # guard only requires the `## X.Y.Z` prefix, and this step must not
          # be stricter than the guard that fronts it).
          NOTES=$(awk -v ver="$PKG_VERSION" '
            /^## / { v = $2; sub(/[^0-9.].*$/, "", v); if (found) exit; if (v == ver) { found = 1; next } }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no section for $PKG_VERSION, cannot build release notes"
            exit 1
          fi
          echo "$NOTES" | gh release create "$TAG" --title "$TAG" --notes-file - --verify-tag
          echo "Created GitHub Release $TAG from the CHANGELOG section"

      - name: Dry run, verify package
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: npm pack --dry-run
