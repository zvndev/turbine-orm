name: Release

# Publish turbine-orm to npm when a `v*` tag is pushed.
#
# Authentication: npm trusted publishing (OIDC) first, the NPM_TOKEN secret
# second. npm 11.5.1+ asks GitHub for an OIDC identity token and exchanges it
# for a one-shot publish credential when the package has a trusted publisher
# for this repository, this workflow file and the `release` environment:
#   npm trust github turbine-orm --file release.yml --repo zvndev/turbine-orm \
#     --env release --allow-publish --yes
# Until that exists the exchange fails quietly and npm falls back to the token.
# npm allows ONE trusted publisher per package, and it is this workflow's, so
# nightly.yml's @next publish keeps using NPM_TOKEN: the secret stays for as
# long as @next is published.
#
# The publish job runs in the `release` environment, which only a `v*` tag or
# `main` may deploy to (Settings → Environments → release). That includes a
# dry run: dispatched from any other branch, the publish job is refused before
# it starts.
#
# Usage (docs/WORKFLOW.md, section 2): land the release commit on main through
# a PR, then tag it. `main` is PR-only, so `npm version` + `git push
# --follow-tags` is refused there; the tag alone is the publish trigger.
#   git tag vX.Y.Z && git push origin vX.Y.Z
#
# The gates are gates.yml, the same workflow ci.yml calls on every push and
# pull request, so a tag is tested by exactly CI's gate: every engine, every
# version matrix, the package-surface checks. Two jobs are release-only:
#
#   - tag-ancestry refuses a tag whose commit is not on main, so a version can
#     only be published from reviewed code.
#   - publish publishes the tarball the gates installed (gates.yml's `pack`
#     job), never a fresh build from the tree. It checks the sha256 of the
#     downloaded artifact against the gates' output, refuses if npm would pack
#     different bytes, and after publishing checks that the registry's
#     integrity equals the tested tarball's. It publishes with `--provenance`
#     so the registry can attest the build to this repo.
#
# A publish requires `gates` (which fails if any gate job fails, see gates.yml
# `gates-ok`) and `tag-ancestry`.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip npm publish)'
        type: boolean
        default: false

# Least privilege at the workflow level, the same posture as ci.yml. Every
# pre-publish gate job runs `npm ci` and then the whole devDependency tree,
# and none of them writes anything, so none of them should hold a token that
# can. `publish` alone needs more (the tag push on the workflow_dispatch path,
# `gh release create`, and an OIDC token for the npm provenance attestation)
# and declares it on the job. Before this block was narrowed, a compromised
# devDependency running inside `test` held a token that could push to main.
permissions:
  contents: read

# Releases queue, they never cancel each other MID-RUN: cancelling a
# half-finished publish can leave npm updated with no tag-side follow-through
# (GitHub Release, smoke test). One shared group means a second tag pushed
# while a release is running waits its turn instead of racing it. Known
# limit: GitHub keeps at most ONE run PENDING per group, so a third tag
# pushed while one runs and one waits evicts the waiter; that tag then needs
# a re-run (or a `workflow_dispatch`) to publish. Tags here are one at a
# time, so the queue-of-one is accepted rather than worked around.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Refuses before any gate runs, so a tag on an unmerged commit fails in a
  # minute rather than after the full gate matrix. A dry run only warns, since
  # it publishes nothing (and its publish job runs only from `main` or a `v*`
  # tag, the refs the `release` environment admits).
  tag-ancestry:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fetch main
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: Require the release commit to be on main
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/check-tag-ancestry.mjs "$GITHUB_SHA" origin/main || echo "::warning::Dry run of a commit that is not on main; a real release of it would be refused."
          else
            node scripts/check-tag-ancestry.mjs "$GITHUB_SHA" origin/main
          fi

  gates:
    needs: tag-ancestry
    uses: ./.github/workflows/gates.yml

  publish:
    timeout-minutes: 30
    needs: [tag-ancestry, gates]
    runs-on: ubuntu-latest
    # The only job that writes: `contents: write` for the workflow_dispatch tag
    # push and for `gh release create`, `id-token: write` for `--provenance`.
    # A job-level block REPLACES the workflow-level one rather than adding to
    # it, so `contents` is restated here.
    permissions:
      contents: write
      id-token: write
    # Deployment rules on the environment admit only a `v*` tag or `main`, and
    # the npm trusted publisher names this environment, so no other job or ref
    # can mint a publish credential.
    environment: release
    # No lifecycle script runs in this job. The tarball was built and checked by
    # the gates; publishing it must not run prepublishOnly or prepack again,
    # which would need the dev tree and could change what is uploaded.
    env:
      npm_config_ignore_scripts: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `registry-url`: it writes an .npmrc token line that reads
      # NODE_AUTH_TOKEN, and every npm command in the job then errors when that
      # is unset. The publish step writes its own token line, and only when the
      # secret exists.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Trusted publishing needs npm 11.5.1 or later and Node 22 ships npm 10.
      # Installed before the staging step, so the npm that proves its repack
      # equals the tested tarball is the npm that publishes. npm 10 and 11.20.0
      # repack the 0.90.0 tarball to the same integrity.
      - name: Use npm 11.20.0
        run: |
          npm install -g npm@11.20.0 --no-audit --no-fund
          V=$(npm --version)
          if [ "$V" != "11.20.0" ]; then
            echo "::error::npm is $V after installing 11.20.0"
            exit 1
          fi

      - name: Resolve version and ensure tag exists
        run: |
          PKG_VERSION=$(jq -r .version package.json)
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/v}"
            if [ "$TAG" != "$PKG_VERSION" ]; then
              echo "::error::Tag v$TAG does not match package.json version $PKG_VERSION"
              exit 1
            fi
          elif [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            # A dry run publishes nothing, so it creates no tag either.
            echo "Dry run: not creating tag v$PKG_VERSION"
          else
            # workflow_dispatch, create tag if it doesn't exist
            if ! git rev-parse "v$PKG_VERSION" >/dev/null 2>&1; then
              git tag "v$PKG_VERSION"
              git push origin "v$PKG_VERSION"
              echo "Created and pushed tag v$PKG_VERSION"
            fi
          fi
          echo "Publishing turbine-orm@$PKG_VERSION"

      # The tarball the gates installed, not a rebuild from this checkout.
      - name: Download the tested tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-tarball
          path: ${{ runner.temp }}/release-package

      # Three refusals. The download is the file the pack job hashed. Its
      # manifest carries the version being released. And npm, packing the
      # extracted directory exactly as `npm publish` below will, produces the
      # same bytes, so what reaches the registry is what the gates installed.
      - name: Verify and stage the tested tarball
        env:
          STAGE: ${{ runner.temp }}/release-package
          TARBALL_NAME: ${{ needs.gates.outputs.tarball }}
          TESTED_SHA256: ${{ needs.gates.outputs.tarball-sha256 }}
          TESTED_INTEGRITY: ${{ needs.gates.outputs.tarball-integrity }}
        run: |
          set -euo pipefail
          if [ -z "$TARBALL_NAME" ] || [ -z "$TESTED_SHA256" ] || [ -z "$TESTED_INTEGRITY" ]; then
            echo "::error::The gates reported no tarball name or hash; refusing to publish a file nobody tested."
            exit 1
          fi
          TARBALL="$STAGE/$TARBALL_NAME"
          ACTUAL=$(sha256sum "$TARBALL" | cut -d' ' -f1)
          if [ "$ACTUAL" != "$TESTED_SHA256" ]; then
            echo "::error::Downloaded tarball sha256 $ACTUAL is not the tested $TESTED_SHA256."
            exit 1
          fi
          tar -xzf "$TARBALL" -C "$STAGE"
          PKG_VERSION=$(jq -r .version package.json)
          TAR_VERSION=$(jq -r .version "$STAGE/package/package.json")
          if [ "$TAR_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::The tested tarball is version $TAR_VERSION, this release is $PKG_VERSION."
            exit 1
          fi
          REPACKED=$(cd "$STAGE/package" && npm pack --dry-run --json | jq -r '.[0].integrity')
          if [ "$REPACKED" != "$TESTED_INTEGRITY" ]; then
            echo "::error::npm would publish different bytes ($REPACKED) from the tested tarball ($TESTED_INTEGRITY)."
            exit 1
          fi
          echo "TESTED_INTEGRITY=$TESTED_INTEGRITY" >> "$GITHUB_ENV"
          echo "Staged $TARBALL_NAME (sha256 $ACTUAL, $TESTED_INTEGRITY)"

      # The tag is the publish trigger, so on a tag PUSH a version that is
      # already on npm got there some other way: a local `npm publish` before
      # the tag, which turns this whole `needs:` chain into an advisory run over
      # a package strangers already have. That used to be answered with a
      # silent skip, and the skip is how four of the six releases before 0.77.0
      # went out tag-second, one of them from a commit whose CI was red. It is
      # now a FAILURE that names the version, so the run is red and says why.
      # `workflow_dispatch` keeps the skip: it is the deliberate re-run path for
      # backfilling a GitHub Release on a version that is legitimately on the
      # registry (npm refuses a republish, so skipping is what lets the release
      # step below run at all), and the dry run never publishes anyway.
      - name: Check version not already published
        id: published
        run: |
          PKG_VERSION=$(jq -r .version package.json)
          if npm view "turbine-orm@$PKG_VERSION" version >/dev/null 2>&1; then
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "::error::turbine-orm@$PKG_VERSION is already on npm, but this run was started by the v$PKG_VERSION tag push. The tag is what publishes; a version that is on the registry before its tag run exists was published outside the release gates. If only the GitHub Release is missing, re-run this workflow with workflow_dispatch instead."
              exit 1
            fi
            echo "turbine-orm@$PKG_VERSION is already on npm; workflow_dispatch run, skipping the publish"
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        id: publish
        if: ${{ github.event.inputs.dry_run != 'true' && steps.published.outputs.already != 'true' }}
        working-directory: ${{ runner.temp }}/release-package/package
        # npm tries trusted publishing before any token, so the token config is
        # only a fallback. The .npmrc line names the variable, never its value,
        # so the secret is not written to disk. The verbose log is read back to
        # say which credential published.
        run: |
          set -euo pipefail
          if [ -n "${NPM_TOKEN:-}" ]; then
            printf '//registry.npmjs.org/:_authToken=${NPM_TOKEN}\n' > "$RUNNER_TEMP/publish.npmrc"
            export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/publish.npmrc"
          fi
          npm publish --provenance --access public --loglevel verbose 2>&1 | tee "$RUNNER_TEMP/publish.log"
          if grep -q 'oidc Successfully retrieved and set token' "$RUNNER_TEMP/publish.log"; then
            echo "::notice::Published with npm trusted publishing (OIDC)."
          else
            echo "::warning::Published with the NPM_TOKEN secret. Trusted publishing is not configured for this workflow yet."
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Install the just-published version from the public registry in a clean
      # temp project and verify the package surface (ESM import, CJS require,
      # CLI bin, serverless subpath). Registry propagation can lag the publish,
      # so retry the install for up to ~2 minutes before failing.
      - name: Post-publish smoke test
        if: ${{ github.event.inputs.dry_run != 'true' && steps.published.outputs.already != 'true' }}
        run: |
          PKG_VERSION=$(jq -r .version package.json)
          SMOKE_DIR=$(mktemp -d)
          cd "$SMOKE_DIR"
          npm init -y > /dev/null
          # THE RETRY BUDGET WAS NEVER THE PROBLEM, and raising it twice is how
          # we found that out. 0.73.1 failed here at 12 x 10s, the budget went to
          # 30 x 10s, and 0.77.0 failed at that too, having published fine with
          # provenance both times.
          #
          # The mechanism is npm's CLIENT-SIDE cache, not registry propagation.
          # registry.npmjs.org serves packuments with `Cache-Control: max-age=300`
          # and npm's `prefer-online` defaults to false, so for 300 seconds npm
          # answers from its local cache WITHOUT revalidating. The first attempt,
          # moments after publish, caches a packument that does not yet list the
          # new version; every later attempt reads that same cached copy and never
          # touches the network. 30 x 10s is exactly 300s, so the loop expired at
          # the precise moment its own cache would have. It could not have
          # succeeded, at any point, for any release.
          #
          # `--prefer-online` forces revalidation on every attempt, which is what
          # makes the retries mean something. The budget stays at 5 minutes: it is
          # now a bound on genuine propagation lag rather than a race against a
          # cache TTL.
          #
          # This step runs AFTER an irreversible publish, so its failure message
          # must not read as "the release failed". By this line the package is on
          # the registry with provenance and the GitHub Release step still runs.
          INSTALLED=0
          for i in $(seq 1 30); do
            if npm install "turbine-orm@$PKG_VERSION" --prefer-online --no-audit --no-fund; then
              INSTALLED=1
              break
            fi
            echo "turbine-orm@$PKG_VERSION not installable yet, retrying in 10s ($i/30)..."
            sleep 10
          done
          if [ "$INSTALLED" != "1" ]; then
            echo "::error::turbine-orm@$PKG_VERSION was PUBLISHED but did not become installable within 5 minutes. The package is on the registry; this is a propagation or registry-availability problem, not a bad release. Verify by hand with: npm view turbine-orm@$PKG_VERSION version"
            exit 1
          fi
          node --input-type=module -e "const m = await import('turbine-orm'); if (!m.TurbineClient) { console.error('ESM import missing TurbineClient'); process.exit(1); } console.log('ESM import OK');"
          node -e "const m = require('turbine-orm'); if (!m.TurbineClient) { console.error('CJS require missing TurbineClient'); process.exit(1); } console.log('CJS require OK');"
          node --input-type=module -e "const m = await import('turbine-orm/serverless'); if (typeof m.turbineHttp !== 'function') { console.error('serverless subpath missing turbineHttp'); process.exit(1); } console.log('serverless subpath OK');"
          npx turbine --version
          npx turbine --version | grep -F "$PKG_VERSION"
          echo "Post-publish smoke test passed for turbine-orm@$PKG_VERSION"

      # The registry holds the bytes the gates tested. The staging step already
      # refused a repack that differed; this reads back what was actually stored.
      - name: Verify the registry holds the tested tarball
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        run: |
          PKG_VERSION=$(jq -r .version package.json)
          for _ in $(seq 1 12); do
            STORED=$(npm view "turbine-orm@$PKG_VERSION" dist.integrity --prefer-online 2>/dev/null || true)
            [ -n "$STORED" ] && break
            sleep 10
          done
          if [ "$STORED" != "$TESTED_INTEGRITY" ]; then
            echo "::error::turbine-orm@$PKG_VERSION on the registry has integrity '$STORED', the tested tarball has $TESTED_INTEGRITY."
            exit 1
          fi
          echo "Registry integrity matches the tested tarball: $STORED"

      # The GitHub Release used to be a manual `gh release create` after every
      # publish, which meant it was sometimes late and could drift from the
      # CHANGELOG. Now the same run that publishes to npm creates it, with the
      # release notes extracted verbatim from the version's CHANGELOG section.
      # Idempotent: an existing release (manual or from a re-run) is left alone.
      # Runs even when the npm publish was skipped as already-published, so a
      # re-run can backfill a missing release without republishing.
      # The condition has to say "the tarball is on the registry", and the
      # obvious spelling of that does NOT: `!cancelled()` alone was written to
      # survive the SMOKE TEST, on the reasoning that the tarball is published
      # by the time that step runs, so notes for a version whose smoke test
      # needs a look beat a published version with no notes. True of the smoke
      # test. Not true of the publish step above it, which the same condition
      # also survives, and 0.78.0 is what that cost: `npm publish` failed on an
      # expired token, and this step went on to announce a GitHub Release,
      # marked Latest, for a version the registry did not have.
      #
      # So gate on the fact rather than on a step that implies it: the publish
      # SUCCEEDED, or it was skipped because the version was already on the
      # registry (the workflow_dispatch backfill path, which is the whole reason
      # this cannot be a plain `success()`). A smoke-test failure still reaches
      # here and still fails the JOB, which was the original intent and is
      # unchanged.
      - name: Create GitHub Release from CHANGELOG
        if: ${{ !cancelled() && github.event.inputs.dry_run != 'true' && (steps.publish.outcome == 'success' || steps.published.outputs.already == 'true') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PKG_VERSION=$(jq -r .version package.json)
          TAG="v$PKG_VERSION"
          if gh release view "$TAG" --json tagName >/dev/null 2>&1; then
            echo "Release $TAG already exists, leaving it alone"
            exit 0
          fi
          # Extract this version's section: from its `## <version> (date)`
          # heading (exclusive) to the next `## ` heading or EOF. The version
          # token is stripped of anything after the digits/dots, so a heading
          # like `## 0.65.0, subtitle` still matches (the changelog-headings
          # guard only requires the `## X.Y.Z` prefix, and this step must not
          # be stricter than the guard that fronts it).
          NOTES=$(awk -v ver="$PKG_VERSION" '
            /^## / { v = $2; sub(/[^0-9.].*$/, "", v); if (found) exit; if (v == ver) { found = 1; next } }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no section for $PKG_VERSION, cannot build release notes"
            exit 1
          fi
          echo "$NOTES" | gh release create "$TAG" --title "$TAG" --notes-file - --verify-tag
          echo "Created GitHub Release $TAG from the CHANGELOG section"

      - name: Dry run, verify package
        if: ${{ github.event.inputs.dry_run == 'true' }}
        working-directory: ${{ runner.temp }}/release-package/package
        run: npm pack --dry-run
