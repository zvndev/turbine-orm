name: Publish @next & nightly engine tests

on:
  # The @next publish is triggered by a SUCCESSFUL CI run on main, not by the
  # push itself. Publishing directly on push only ever ran lint / typecheck /
  # unit / build: no integration, no pack-smoke, no coverage, no error-code
  # check. ci.yml's real gates ran in parallel, so a push that broke a real
  # Postgres could still ship to the @next tag before CI went red. Hanging the
  # publish off `workflow_run` makes every ci.yml gate a prerequisite while
  # keeping this an on-push (per-commit) prerelease.
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  # Nightly run for the heavy/flaky engine-integration jobs that were parked
  # out of per-PR CI (see yugabytedb-integration below). 09:17 UTC daily.
  schedule:
    - cron: '17 9 * * *'

# Only one publish at a time per branch (scheduled runs get their own group so
# a nightly engine test can't cancel an in-flight publish).
concurrency:
  group: publish-next-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege at the workflow level: the engine and fuzz jobs below run
# the whole devDependency tree and write nothing. Only `publish-next` needs an
# OIDC token (for the npm provenance attestation) and declares it on the job.
permissions:
  contents: read

jobs:
  publish-next:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    # A job-level block REPLACES the workflow-level one, so `contents` is
    # restated. No `contents: write`: this job pushes no tag and creates no
    # release, it publishes a prerelease and stops.
    permissions:
      contents: read
      id-token: write
    # The same protected environment as release.yml's publish job (it admits
    # only a `v*` tag or `main`).
    environment: release
    # Only publish when a CI run on main SUCCEEDED. Not on the nightly schedule,
    # and never off a red, cancelled or skipped CI run. `head_branch` is checked
    # explicitly as well as in the trigger filter so a workflow_run replay from
    # another branch can never publish.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    steps:
      # workflow_run runs against the default branch by default; check out the
      # exact commit CI validated so the published prerelease is that commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # No `registry-url`, for the reason given in release.yml's publish job.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Set prerelease version
        run: |
          # Use short SHA for unique prerelease identifier
          SHORT_SHA=$(git rev-parse --short HEAD)
          CURRENT=$(jq -r .version package.json)
          NEXT_VERSION="${CURRENT}-next.${SHORT_SHA}"
          npm version "$NEXT_VERSION" --no-git-tag-version
          echo "Publishing turbine-orm@${NEXT_VERSION} as @next"

      # Publishes with the NPM_TOKEN secret. npm allows one trusted publisher per
      # package and it belongs to release.yml, so this job cannot use OIDC. The
      # token line names the variable, never its value, and is written only for
      # this step (setup-node's `registry-url` would make every npm command in
      # the job need NODE_AUTH_TOKEN).
      - name: Publish to npm with @next tag
        run: |
          set -euo pipefail
          printf '//registry.npmjs.org/:_authToken=${NPM_TOKEN}\n' > "$RUNNER_TEMP/publish.npmrc"
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/publish.npmrc" npm publish --tag next --provenance --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Candidate integration only: this narrow timeout smoke cannot certify an
  # engine. Launch after checkout so readiness failures retain logs/evidence.
  # This scheduled job is not a PR/release gate; its failure stays visible.
  yugabytedb-integration:
    timeout-minutes: 25
    name: yugabytedb-integration
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Initialize uncertified evidence
        run: node scripts/yugabyte-readiness.mjs init
      - run: npm ci
      - name: Launch YugabyteDB and run candidate timeout smoke
        run: node scripts/yugabyte-readiness.mjs run
        env:
          DATABASE_URL: postgres://yugabyte@127.0.0.1:5433/yugabyte?sslmode=disable
          TURBINE_TEST_ENGINE: yugabytedb
          # The smoke's availability gate checks DATABASE_URL, hence postgres.
          TURBINE_REQUIRE_ENGINE: postgres
      - name: Validate candidate evidence even after failure
        if: always()
        run: node scripts/yugabyte-readiness.mjs finalize
      - name: Preserve candidate evidence and failure logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yugabytedb-candidate-${{ github.sha }}
          path: artifacts/yugabytedb/
          if-no-files-found: error
          retention-days: 14

  # Extended run of the join/batched/auto differential fuzz (strategy-fuzz.test.ts).
  # The unit lane runs its three fixed seeds on every push/publish, which keeps
  # the lane deterministic but means the explored space never moves; this job
  # derives the seed from the date so each night walks new query shapes. The
  # seed and case count are printed first (and are in the failing assertion
  # message too), so any red night is reproducible locally with
  # TURBINE_FUZZ_SEED/TURBINE_FUZZ_CASES. In-memory sqlite: no service, fast.
  strategy-fuzz-extended:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Differential fuzz, date-derived seed
        run: |
          SEED=$(date -u +%Y%m%d)
          echo "Reproduce locally with: TURBINE_FUZZ_SEED=$SEED TURBINE_FUZZ_CASES=20000 npx tsx --test src/test/strategy-fuzz.test.ts"
          TURBINE_FUZZ_SEED="$SEED" TURBINE_FUZZ_CASES=20000 npx tsx --test src/test/strategy-fuzz.test.ts

  # The differential oracle tests at their nightly sizes. Every PR already runs
  # them at the fast sizes and the fixed default seed: they are
  # src/test/oracle-*.test.ts, which `npm test` picks up in gates.yml's
  # integration-tests (Postgres 14 to 18) and coverage jobs. This run widens
  # the random search (TURBINE_ORACLE_FULL=1) and moves the seed every day, so
  # it explores inputs the per-PR run never reaches. The seed is printed with
  # the command that replays it.
  #
  # The cross-engine battery (oracle-engines-*) is not here: its scenarios are
  # fixed rather than random, so neither variable changes it, and it runs on
  # every PR in each engine's own job.
  oracle-extended:
    timeout-minutes: 45
    name: oracle-extended (postgres ${{ matrix.postgres-version }})
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        postgres-version: [14, 17]
    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: turbine_oracle
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Oracle tests, full sizes, date-derived seed
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/turbine_oracle
          TURBINE_ORACLE_FULL: '1'
          # A skipped oracle file is a failure here, not a pass.
          TURBINE_REQUIRE_ENGINE: postgres
        run: |
          SEED=$(date -u +%Y%m%d)
          FILES=()
          for f in src/test/oracle-*.test.ts; do
            case "$f" in src/test/oracle-engines-*) continue ;; esac
            FILES+=("$f")
          done
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::No oracle test files found; this job would pass while running nothing."
            exit 1
          fi
          echo "Seed $SEED. Reproduce one file locally with:"
          echo "  TURBINE_ORACLE_SEED=$SEED TURBINE_ORACLE_FULL=1 DATABASE_URL=... npx tsx --test src/test/<file>"
          printf 'Running %s\n' "${FILES[@]}"
          TURBINE_ORACLE_SEED="$SEED" npx tsx --test --test-concurrency=1 "${FILES[@]}"
