name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for the whole workflow. Nothing in this file writes to the
# repository: no `gh` calls, no GITHUB_TOKEN use, no release step, no package
# publish (the one artifact, the packed tarball, is a workflow artifact). Every job only needs to check the code out and run
# npm. Declaring it here also overrides whatever the org/repo default happens to
# be, so a permissive default (the historical `write-all`) cannot silently hand
# a token with push rights to jobs that run third-party npm lifecycle scripts.
# Publishing lives in release.yml, which declares its own permissions.
permissions:
  contents: read

jobs:
  # Every gate job lives in gates.yml, which release.yml calls too, so the
  # release gate is this gate by construction. Its jobs show up here as
  # `gates / <job>`.
  gates:
    uses: ./.github/workflows/gates.yml

  # The ONLY required status check on `main`. It needs the call above, whose
  # result is the result of every job in gates.yml (gates.yml's own `gates-ok`
  # aggregates them with the same anti-vacuous rule). A job added to ci.yml
  # outside gates.yml must also be added here and the floor raised;
  # src/test/ci-ok-needs-sync.test.ts asserts both files.
  ci-ok:
    if: always()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs:
      - gates
    steps:
      - name: Fail unless every job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          # Anti-vacuous: an empty or unparseable `needs` object would otherwise
          # report success while checking nothing.
          count=$(echo "$RESULTS" | jq 'length')
          if [ "$count" -lt 1 ]; then
            echo "ci-ok saw $count dependencies, expected at least 1" >&2
            exit 1
          fi
          failed=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"')
          if [ -n "$failed" ]; then
            echo "These jobs did not succeed:" >&2
            echo "$failed" >&2
            exit 1
          fi
          echo "All $count jobs succeeded."
